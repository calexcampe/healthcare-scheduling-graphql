server:
  port: 8081

spring:
  application:
    name: scheduling-service

  datasource:
    url: jdbc:h2:mem:scheduling;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  graphql:
    graphiql:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
